# ============ 默认通用配置 ============
# 无 profile 时故意连不存在的库，强制必须激活 dev 或 prod profile
# 激活方式：
#   本地开发  : java -jar app.jar --spring.profiles.active=dev
#   生产部署  : java -jar app.jar --spring.profiles.active=prod
#              (systemd 里设 SPRING_PROFILES_ACTIVE=prod)

spring:
  # 不设 active，让它走下面故意崩的 datasource
  # profiles: active: xxx
  servlet:
    multipart:
      enabled: true
      max-file-size: 100MB
      max-request-size: 100MB
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        fetch_size: 100
  sql:
    init:
      mode: never
  # 无 profile 时的 datasource — 故意指向不存在的库
  # 任何忘记激活 profile 的启动都会直接崩
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/__NO_PROFILE_ACTIVATED__?useSSL=false
    username: no_profile
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

server:
  port: 9090
  tomcat:
    threads:
      min-spare: 10
      max: 80            # 4C/8G → 80线程足够(IO密集但短请求多)
    accept-count: 100
    max-connections: 10000
    connection-timeout: 5000
    compression:
      enabled: true
      mime-types: text/html,text/xml,text/plain,application/json,application/javascript,application/xml
      min-response-size: 1024
  websocket:
    max-message-size: 4194304  # 4MB (之前64MB浪费内存, agent心跳消息远小于这个)

discord:
  bot-token: ${DISCORD_BOT_TOKEN:}
  emulator:
    apk-path: /tmp/discord-emulator

mumu:
  mumutool-path: ${MUMU_TOOL_PATH:}
  adb-path: ${MUMU_ADB_PATH:}
  vms-base-path: ${MUMU_VMS_PATH:}
  discord-apk-path: ${user.home}/.discord-admin/discord.apk
  discord-apk-url: https://discord.com/api/download/stable
  default-emulator-count: 1
  max-emulator-count: 10

jwt:
  # 默认给一个开发用的值，但 prod 必须通过环境变量覆盖
  secret: ${JWT_SECRET:discord-admin-dev-secret-key-change-me-in-prod-0123456789}
  expire-hours: 24

spring.main.allow-bean-definition-overriding: false

app:
  upload:
    path: ${APP_UPLOAD_PATH:${user.home}/.discord-admin/uploads}
  mumu-agent-path: ${APP_MUMU_AGENT_PATH:}
  admin-mode: true
