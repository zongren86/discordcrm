# ============ 本地开发环境 ============
# 激活方式：启动参数 --spring.profiles.active=dev 或环境变量 SPRING_PROFILES_ACTIVE=dev

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/discordadmin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true&useCompression=true&createDatabaseIfNotExist=true
    username: root
    password: Len2026!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 3
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000
      pool-name: DiscordHikariCP-Dev
      connection-test-query: SELECT 1
      leak-detection-threshold: 60000
      validation-timeout: 1000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# 本地开发：代理自动检测，模拟器本地模式
discord:
  proxy:
    enabled: ${DISCORD_PROXY_ENABLED:auto}
    host: ${DISCORD_PROXY_HOST:127.0.0.1}
    port: ${DISCORD_PROXY_PORT:7890}
    health-check-timeout: ${DISCORD_PROXY_HEALTH_TIMEOUT:3000}
    websocket-direct: ${DISCORD_WEBSOCKET_DIRECT:true}

emulator:
  local-mode: ${EMULATOR_LOCAL_MODE:true}

# 本地 base-url
app:
  base-url: ${APP_BASE_URL:http://localhost:9090}

# 本地 debug 日志
logging:
  level:
    com.discordadmin: debug
    net.dv8tion.jda: warn
