# ============ 生产部署环境 ============
# 激活方式：SPRING_PROFILES_ACTIVE=prod
# 生产必须设以下环境变量:
#   DB_HOST       = 101.47.41.155
#   DB_PASSWORD   = 你的密码
#   JWT_SECRET    = 随机串 ≥ 32 字节
#
# 硬件假设: 应用 4C/8G, DB 2C/4G 共用 (DB 是瓶颈)
# =================================================================

spring:
  datasource:
    # 生产 JDBC URL 关键参数说明:
    #   useSSL=false              — 同机房内网, 跳过 SSL 开销
    #   cachePrepStmts=true      — 服务端预编译语句缓存 (必须)
    #   rewriteBatchedStatements — 批量 rewrite 成一条, 减少 DB 往返
    #   useCompression=true      — 压缩减少网络带宽 (10M 带宽有帮助)
    #   socketTimeout=30000      — 防止网络抖动永久阻塞 (30s)
    #   connectTimeout=5000      — 连接建立超时 (5s, 快速失败)
    #   wait_timeout=28800       — MySQL 服务端会话超时 8h (Hikari max-lifetime=20min 足够)
    url: jdbc:mysql://${DB_HOST:}:3306/discordadmin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true&useCompression=true&socketTimeout=30000&connectTimeout=5000&wait_timeout=28800
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # ============ 连接池参数 (针对 2C/4G 共用 DB 瓶颈) ============
      # 4C/8G 应用 → pool=15 (DB 2C/4G 总共撑 50-80 连接, 还要留给旧 server/admin)
      maximum-pool-size: 15
      minimum-idle: 5                    # 保持 5 个热连接, 避免首请求冷启动
      connection-timeout: 5000           # 5s 获取不到连接 → 快速失败 (暴露问题而非拖死)
      idle-timeout: 60000                # 1min 空闲回收 (别太频繁, 保持热连接)
      max-lifetime: 1200000              # 20min 主动回收 (比 MySQL 默认 wait_timeout=8h 早很多)
      pool-name: DiscordHikariCP-Prod
      connection-test-query: SELECT 1
      leak-detection-threshold: 20000    # 20s 借出去没还 → WARN 日志 (生产调试神器)
      validation-timeout: 300            # 连接有效性检测 300ms (快速)
      # 以下为 HikariCP 内部调优 (默认值已不错, 显式列出便于理解)
      initialization-fail-timeout: -1     # 启动时连不上 DB 不崩, 持续重试
      keepalive-time: 0                   # 保持连接由 max-lifetime 管理, 不用额外 keepalive
  jpa:
    open-in-view: false                  # 关键! HTTP 请求结束立即释放连接
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      # Hibernate SQL 日志走 logback, 此处彻底关闭
      hibernate:
        format_sql: false
        use_sql_comments: false

# 生产环境: 直连 (不走代理), 模拟器通过 Agent 远程控制
discord:
  proxy:
    enabled: false
    host: 127.0.0.1
    port: 7890
    health-check-timeout: 3000
    websocket-direct: true

emulator:
  local-mode: false

# 生产必须覆盖 JWT_SECRET, 空默认值导致 WeakKeyException 启动崩
jwt:
  secret: ${JWT_SECRET:}

# 生产 base-url — 应用服务器 IP
app:
  base-url: ${APP_BASE_URL:http://101.47.41.149:9090}

# 生产日志: INFO + 文件滚动 (logback-spring.xml 配置)
logging:
  level:
    root: info
    com.discordadmin: info
    com.discordadmin.discord.UserMessagePoller: warn   # 消息轮询太吵, 降到 warn
    com.discordadmin.service.CloudWebSocketService: warn  # 心跳日志太吵, 降到 warn
    net.dv8tion.jda: warn
  # 生产关闭 spring actuator 默认健康端点里的 db 检测 (避免无意义 DB 连接)
  # 如需开启: management.endpoint.health.show-details=always

