# ============ 生产部署环境 ============
# 激活方式：启动参数 --spring.profiles.active=prod 或环境变量 SPRING_PROFILES_ACTIVE=prod

spring:
  datasource:
    url: jdbc:mysql://101.47.41.155:3306/discordadmin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true&useCompression=true
    username: root
    password: ${DB_PASSWORD:Dsdb2026!}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 30
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 300000
      max-lifetime: 1800000
      pool-name: DiscordHikariCP-Prod
      connection-test-query: SELECT 1
      leak-detection-threshold: 30000
      validation-timeout: 1000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

# 生产环境：直连（不走代理），模拟器通过 Agent 远程控制
discord:
  proxy:
    enabled: false
    host: 127.0.0.1
    port: 7890
    health-check-timeout: 3000
    websocket-direct: true

emulator:
  local-mode: false

# 生产 base-url
app:
  base-url: ${APP_BASE_URL:http://101.47.41.151:9090}

# 生产 warn 日志（WARN+）
logging:
  level:
    com.discordadmin: info
    net.dv8tion.jda: warn
