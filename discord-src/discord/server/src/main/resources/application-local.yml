# ==========================================
# Local 开发环境 — 连本地 MySQL
# 激活: --spring.profiles.active=local
# 本地机器: MacBook Air / 多核 / 内存充足
# ==========================================

server:
  tomcat:
    max-threads: 100
    min-spare-threads: 10

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/discordadmin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&createDatabaseIfNotExist=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&useCompression=true
    username: root
    password: Len2026!
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 10000
      leak-detection-threshold: 10000

  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MySQL8Dialect
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    root: INFO
    com.discordadmin: DEBUG
    org.hibernate.SQL: DEBUG
