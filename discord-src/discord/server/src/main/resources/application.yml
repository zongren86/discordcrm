server:
  port: 8090
  address: 0.0.0.0
  tomcat:
    # 通用安全下限，prod/local profile 会覆盖
    max-threads: 80
    min-spare-threads: 10
    accept-count: 100
    max-connections: 2048
  websocket:
    max-message-size: 67108864  # 64MB WebSocket最大消息大小

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 500MB
      max-request-size: 500MB

  # ========== datasource 必须通过 profile 配置 ==========
  # 没有 active profile 时用这里的 dummy 值，启动会报错，强制走 profile
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/__NO_PROFILE_ACTIVATED__?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&createDatabaseIfNotExist=true
    username: ${DB_USERNAME:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      # 全局安全下限，具体值由 profile 覆盖
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      pool-name: DiscordHikariCP
      transaction-isolation: TRANSACTION_READ_COMMITTED
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true

  sql:
    init:
      mode: never

discord:
  bot-token: ${DISCORD_BOT_TOKEN:}
  proxy:
    enabled: ${DISCORD_PROXY_ENABLED:auto}
    host: ${DISCORD_PROXY_HOST:127.0.0.1}
    port: ${DISCORD_PROXY_PORT:7890}
    health-check-timeout: ${DISCORD_PROXY_HEALTH_TIMEOUT:3000}
    websocket-direct: ${DISCORD_WEBSOCKET_DIRECT:true}
  emulator:
    apk-path: /tmp/discord-emulator

mumu:
  mumutool-path: ${MUMU_TOOL_PATH:}
  adb-path: ${MUMU_ADB_PATH:}
  vms-base-path: ${MUMU_VMS_PATH:}
  discord-apk-path: ${user.home}/.discord-admin/discord.apk
  discord-apk-url: https://discord.com/api/download/stable
  default-emulator-count: 1
  max-emulator-count: 10

emulator:
  local-mode: ${EMULATOR_LOCAL_MODE:false}

jwt:
  secret: ${JWT_SECRET:discord-admin-dev-secret-key-change-me-in-prod-0123456789}
  expire-hours: 24

spring.main.allow-bean-definition-overriding: false

# 全局 JVM 参数提示（由启动脚本或 systemd 注入）
# -Xms512m -Xmx2048m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/var/log/discord-admin/ -XX:+UseG1GC -XX:MaxGCPauseMillis=200

app:
  upload:
    path: ${APP_UPLOAD_PATH:${user.home}/.discord-admin/uploads}
  base-url: ${APP_BASE_URL:http://localhost:5173}
  mumu-agent-path: ${APP_MUMU_AGENT_PATH:}
  # crm_agent 源码目录（用于动态打包下载）；空时尝试自动推断
  agent-source-dir: ${APP_AGENT_SOURCE_DIR:}
