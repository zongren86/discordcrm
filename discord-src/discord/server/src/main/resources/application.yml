server:
  port: 8090
  websocket:
    max-message-size: 67108864  # 64MB WebSocket最大消息大小

spring:
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/discordadmin?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&rewriteBatchedStatements=true&useCompression=true
    username: root
    password: Len2026!
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 10000
      idle-timeout: 300000
      max-lifetime: 1800000
      pool-name: DiscordHikariCP
  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        jdbc:
          batch_size: 50
  sql:
    init:
      mode: never

discord:
  bot-token: ${DISCORD_BOT_TOKEN:}
  proxy:
    host: ${DISCORD_PROXY_HOST:127.0.0.1}
    port: ${DISCORD_PROXY_PORT:7890}

jwt:
  secret: ${JWT_SECRET:discord-admin-dev-secret-key-change-me-in-prod-0123456789}
  expire-hours: 24

logging:
  level:
    com.discordadmin: debug
    net.dv8tion.jda: warn

# 启动性能优化
spring.main.allow-bean-definition-overriding: false
