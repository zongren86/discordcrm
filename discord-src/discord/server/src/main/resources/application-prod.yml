# ==========================================
# Production 环境 — 149 应用服务器 4C/8G + 155 DB 2C/4G
# 激活: --spring.profiles.active=prod
# DB_PASSWORD / DB_HOST / JWT_SECRET 全部从环境变量读
# ==========================================

server:
  tomcat:
    # 4C/8G 机器：经验值 = 2 × CPU² = 32，留冗余到 64
    max-threads: 64
    min-spare-threads: 8
    accept-count: 128
    max-connections: 4096
    connection-timeout: 20000

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:}:${DB_PORT:3306}/${DB_NAME:discordadmin}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8&useUnicode=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&useCompression=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      # 30 连接：DB 2C/4G MySQL max_connections 约 200，
      # 本服务 30 + server-admin 20 + 其他客户端 30 = 80，留 120 buffer
      maximum-pool-size: 30
      minimum-idle: 8
      connection-timeout: 30000
      idle-timeout: 120000
      max-lifetime: 900000        # 15分钟 < MySQL wait_timeout(8h)，避免连接被回收
      validation-timeout: 5000
      leak-detection-threshold: 30000  # 30s 未归还就打 warn
      keepalive-time: 60000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      dialect: org.hibernate.dialect.MySQL8Dialect
      ddl-auto: none
    show-sql: false

logging:
  level:
    root: INFO
    com.discordadmin: INFO
    net.dv8tion.jda: WARN
    org.hibernate.SQL: WARN

app:
  upload:
    path: /opt/discord-admin/uploads
  base-url: ${APP_BASE_URL:http://101.47.41.149:8090}

jwt:
  secret: ${JWT_SECRET:}  # 生产必须设环境变量，不能用默认值
